services:
  - type: web
    name: nexum-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    disk:
      name: nexum-datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: NEXUM_DATA_DIR
        value: /var/data
      - key: FRONTEND_ORIGIN
        sync: false
  - type: web
    name: nexum-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

